name: Auto Update Quant Data

on:
  schedule:
    # 每天北京时间 18:00 和 22:00 自动触发
    - cron: '0 10,14 * * 1-5'
  workflow_dispatch: # 支持网页端手动一键触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # 使用刚才配置的密钥

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests openpyxl

      - name: Run Crawler & Update Data Script
        run: |
          python Tool/update_v6_data.py  # 你的更新脚本路径

      - name: Commit and Push New Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-update quant data by GitHub Actions" || exit 0
          git push
